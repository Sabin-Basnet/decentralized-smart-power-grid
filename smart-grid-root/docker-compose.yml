version: '3.8'

services:
  # PostgreSQL Database (optional, alternative to SQLite)
  # Uncomment to use PostgreSQL instead of SQLite
  # db:
  #   image: postgres:15-alpine
  #   environment:
  #     POSTGRES_USER: smartgrid
  #     POSTGRES_PASSWORD: gridpower123
  #     POSTGRES_DB: smart_grid_db
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart-grid-backend
    ports:
      - "8000:8000"
    environment:
      - FASTAPI_HOST=0.0.0.0
      - FASTAPI_PORT=8000
      - DATABASE_URL=sqlite:///./smart_grid.db
      # - DATABASE_URL=postgresql://smartgrid:gridpower123@db:5432/smart_grid_db
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      # - db  # Uncomment if using PostgreSQL
      - hardhat

  # Hardhat Blockchain Node
  hardhat:
    build:
      context: ./blockchain
      dockerfile: Dockerfile
    container_name: smart-grid-hardhat
    ports:
      - "8545:8545"
    volumes:
      - ./blockchain:/app
    command: npx hardhat node --hostname 0.0.0.0

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart-grid-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      - backend

# Optional: Nginx Reverse Proxy (for production)
  # nginx:
  #   image: nginx:alpine
  #   container_name: smart-grid-nginx
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #   depends_on:
  #     - backend
  #     - frontend

volumes:
  postgres_data:

networks:
  default:
    name: smart-grid-network
    driver: bridge
